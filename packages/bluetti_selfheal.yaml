# Bluetti / buzzbrick telemetry self-heal (cards #212, #214, #246)
# ===========================================================================
# Makes the Bluetti *cloud* integration self-recover when a transient
# DNS/network blip wedges its poller, so battery telemetry can't silently
# freeze for ~44h again (incident 2026-07-24 ~19:00). #214 adds a second
# freeze-mode detector — FRESH all-zeros (incident 2026-07-26) — that the
# `last_reported`-freshness logic below cannot see; it reuses the SAME reload
# automation, cooldown and retry cap. #246 adds an owner-facing escalation:
# when the auto-heal has SPENT its reload budget (counter cap 4) and telemetry
# is STILL frozen, a persistent notification tells the owner to power-cycle the
# battery by hand (reloads can't fix a hardware/cloud outage). It reuses the
# SAME detectors/counter/cooldown — no new detectors. Companion runbook:
#   ../bluetti-selfheal.md   (design rationale, apply steps for vesta,
#                             how to find the config_entry_id, #211 interlock).
#
# This is a drop-in Home Assistant *package*. It is NOT auto-deployed: the
# `home-assitant` repo is docs/runbooks/packages only and does NOT sync to the
# vesta host (vesta.local / 192.168.50.18). Apply it BY HAND on vesta:
#   /config/packages/bluetti_selfheal.yaml
# and make sure configuration.yaml enables packages:
#   homeassistant:
#     packages: !include_dir_named packages
#
# ---------------------------------------------------------------------------
# WHY THIS SHAPE (freshness signal — the design nuance from the card):
#
#  * The freeze signature was "stale-but-present": the sensors kept their last
#    numeric value and NEVER went `unavailable`. So `availability`/`unavailable`
#    checks do NOT catch it. We must detect that the integration stopped
#    *polling*.
#  * We therefore key staleness off `last_reported`, NOT `last_updated`.
#    `last_reported` advances on EVERY successful coordinator poll even when the
#    value is unchanged; `last_updated`/`last_changed` only move when the value
#    changes. That distinction matters because SoC (battery_level %) — and even
#    the power sensors overnight when the battery is idle — can hold a steady
#    value for long stretches while the integration is perfectly healthy. Keying
#    on `last_updated` would false-positive every idle night. Keying on
#    `last_reported` = "did we get a fresh poll", which is exactly the freeze.
#  * We take the MIN age across all four battery entities (the *freshest* one).
#    They share one coordinator and froze at the same timestamp in the incident,
#    so if even the freshest hasn't reported in > threshold, the whole
#    integration is wedged. Using the freshest (min) makes a single entity quirk
#    unable to trigger a false freeze — they must ALL be stale together.
#
# Threshold: `input_number.bluetti_stale_threshold_minutes` (default 5 min).
# The Bluetti cloud poll cadence is seconds, so 5 min of no fresh poll = dozens
# of missed polls = genuinely frozen. The reload automation additionally
# requires the stale state to persist (`for: 2min`) before acting, so a blip
# that self-heals within a poll or two never triggers a reload.
# ===========================================================================

# --- Tunable + state helpers ------------------------------------------------
input_number:
  bluetti_stale_threshold_minutes:
    name: Bluetti stale-telemetry threshold
    min: 1
    max: 60
    step: 1
    unit_of_measurement: min
    icon: mdi:timer-alert

input_datetime:
  bluetti_selfheal_last_reload:
    name: Bluetti self-heal last reload
    has_date: true
    has_time: true

counter:
  bluetti_selfheal_reload_count:
    name: Bluetti self-heal reload count
    initial: 0
    step: 1
    minimum: 0
    maximum: 100
    icon: mdi:counter

# --- Freeze detector --------------------------------------------------------
template:
  - binary_sensor:
      - name: Bluetti Telemetry Stale
        unique_id: bluetti_telemetry_stale
        device_class: problem
        icon: mdi:battery-alert-variant-outline
        # `now()` makes HA re-evaluate this sensor every minute automatically,
        # giving a 1-minute staleness poll with no extra triggers.
        state: >
          {% set threshold = (states('input_number.bluetti_stale_threshold_minutes') | float(5)) * 60 %}
          {% set signals = [
            'sensor.office_buzzbrick_ap3002532000565690_grid_input_power',
            'sensor.office_buzzbrick_ap3002532000565690_alternating_current_out_power',
            'sensor.office_buzzbrick_ap3002532000565690_photovoltaics_input_power',
            'sensor.office_buzzbrick_battery_level'
          ] %}
          {% set ns = namespace(ages=[]) %}
          {% for e in signals %}
            {% if states(e) not in ['unknown', 'unavailable'] and states[e] is not none %}
              {% set ns.ages = ns.ages + [ (now() - states[e].last_reported).total_seconds() ] %}
            {% endif %}
          {% endfor %}
          {% if ns.ages | length == 0 %}
            true
          {% else %}
            {{ (ns.ages | min) > threshold }}
          {% endif %}
        attributes:
          # Age of the freshest battery signal, for dashboards / debugging.
          freshest_signal_age_seconds: >
            {% set signals = [
              'sensor.office_buzzbrick_ap3002532000565690_grid_input_power',
              'sensor.office_buzzbrick_ap3002532000565690_alternating_current_out_power',
              'sensor.office_buzzbrick_ap3002532000565690_photovoltaics_input_power',
              'sensor.office_buzzbrick_battery_level'
            ] %}
            {% set ns = namespace(ages=[]) %}
            {% for e in signals %}
              {% if states(e) not in ['unknown', 'unavailable'] and states[e] is not none %}
                {% set ns.ages = ns.ages + [ (now() - states[e].last_reported).total_seconds() ] %}
              {% endif %}
            {% endfor %}
            {{ (ns.ages | min) | round(0) if ns.ages | length > 0 else 'unknown' }}
          threshold_seconds: >
            {{ (states('input_number.bluetti_stale_threshold_minutes') | float(5)) * 60 }}

      # Fresh all-zeros detector (incident 2026-07-26). A DIFFERENT freeze mode:
      # the cloud integration kept polling — `last_reported` advanced every ~13s,
      # so the stale detector above stayed `off` — but it reported SoC, grid-in
      # AND AC-out all EXACTLY 0 at once. That is physically implausible for a
      # live, charged battery in a house that always draws some load, so we treat
      # the simultaneous all-zeros as a wedged integration and reload it too.
      #
      # SOLAR IS DELIBERATELY EXCLUDED from the conjunction: PV input is
      # legitimately 0 every night, so requiring it == 0 would not discriminate a
      # fault from a normal dusk — it would only add false negatives (never a
      # true positive). We require the SoC, grid-in and AC-out to be all present
      # (not unknown/unavailable) AND all ~0 (small epsilon float compare).
      - name: Bluetti Telemetry All Zero
        unique_id: bluetti_telemetry_all_zero
        device_class: problem
        icon: mdi:battery-off-outline
        state: >
          {% set eps = 0.001 %}
          {% set soc = 'sensor.office_buzzbrick_battery_level' %}
          {% set grid = 'sensor.office_buzzbrick_ap3002532000565690_grid_input_power' %}
          {% set ac = 'sensor.office_buzzbrick_ap3002532000565690_alternating_current_out_power' %}
          {% set signals = [soc, grid, ac] %}
          {% set ns = namespace(present=true) %}
          {% for e in signals %}
            {% if states(e) in ['unknown', 'unavailable'] or states[e] is none %}
              {% set ns.present = false %}
            {% endif %}
          {% endfor %}
          {% if not ns.present %}
            false
          {% else %}
            {{ ((states(soc) | float(0)) | abs) < eps
               and ((states(grid) | float(0)) | abs) < eps
               and ((states(ac) | float(0)) | abs) < eps }}
          {% endif %}
        attributes:
          # Raw values of the three conjuncts, for dashboards / debugging. Solar
          # is shown too (context only) but is NOT part of the trigger logic.
          soc_percent: >
            {{ states('sensor.office_buzzbrick_battery_level') }}
          grid_input_power_w: >
            {{ states('sensor.office_buzzbrick_ap3002532000565690_grid_input_power') }}
          ac_output_power_w: >
            {{ states('sensor.office_buzzbrick_ap3002532000565690_alternating_current_out_power') }}
          photovoltaics_input_power_w_excluded: >
            {{ states('sensor.office_buzzbrick_ap3002532000565690_photovoltaics_input_power') }}

      # LAR-liveness signal (#259) — HA-side half of the jupiter lar permanent
      # fix (lar PR #125). ------------------------------------------------------
      # The lar reads HA over REST /api/states, which serves a CACHE-FROZEN
      # `last_reported` (it advances only on a value CHANGE over the REST API).
      # For an idle battery every value is constant, so ALL REST timestamps
      # freeze — and the lar cannot distinguish "integration idle-but-alive"
      # from "integration dead". HA's TEMPLATE engine, by contrast, sees the
      # TRUE ~13s `last_reported` heartbeat (that is exactly what the Stale
      # detector above keys off). So we expose that live liveness verdict as a
      # plain entity STATE the lar can read over REST: on/off, not a timestamp.
      # The lar consumes this via `ha.battery_liveness_entity` instead of any
      # REST timestamp.
      #
      # Semantics expected by lar PR #125:
      #   on  ⇔ integration CONFIRMED ALIVE = NOT stale AND NOT all-zero.
      #   off ⇔ not confirmed alive (frozen, all-zeros, OR a detector is itself
      #         unknown/unavailable) — the safe/conservative value so the lar
      #         keeps its hold rather than trusting a wedged sensor.
      #
      # Robustness: this is a STRICT positive confirmation. It is `on` ONLY when
      # BOTH underlying detectors are present, in a known state, and NOT firing.
      # If either detector is unknown/unavailable we return `off` explicitly —
      # note that a bare `not is_state(stale,'on')` would read TRUE for an
      # unavailable detector (is_state != 'on'), which would FALSELY assert
      # alive; the explicit guard below prevents that. Because it inherits the
      # Stale detector's template-based `last_reported` heartbeat, it is `on`
      # while the integration polls (even when idle with constant values) and
      # flips `off` once the heartbeat freezes.
      - name: Bluetti Integration Alive
        unique_id: bluetti_integration_alive
        device_class: connectivity   # on = connected/alive, off = down
        icon: mdi:heart-pulse
        state: >
          {% set stale = 'binary_sensor.bluetti_telemetry_stale' %}
          {% set zero  = 'binary_sensor.bluetti_telemetry_all_zero' %}
          {% if states(stale) in ['unknown', 'unavailable'] or states[stale] is none
             or states(zero)  in ['unknown', 'unavailable'] or states[zero]  is none %}
            off
          {% else %}
            {{ not is_state(stale, 'on') and not is_state(zero, 'on') }}
          {% endif %}
        attributes:
          # Surface the two conjuncts + a compact reason, for dashboards / the
          # lar's own diagnostics.
          stale: >
            {{ states('binary_sensor.bluetti_telemetry_stale') }}
          all_zero: >
            {{ states('binary_sensor.bluetti_telemetry_all_zero') }}
          reason: >
            {% set stale = 'binary_sensor.bluetti_telemetry_stale' %}
            {% set zero  = 'binary_sensor.bluetti_telemetry_all_zero' %}
            {% if states(stale) in ['unknown', 'unavailable'] or states[stale] is none
               or states(zero)  in ['unknown', 'unavailable'] or states[zero]  is none %}
              detectors_unavailable
            {% elif is_state(stale, 'on') and is_state(zero, 'on') %}
              stale_and_all_zero
            {% elif is_state(stale, 'on') %}
              stale
            {% elif is_state(zero, 'on') %}
              all_zero
            {% else %}
              alive
            {% endif %}

# --- Auto-recover + loop guard ----------------------------------------------
automation:
  # 1) When telemetry has been frozen for a sustained window, reload the Bluetti
  #    config entry. Loop-guarded by a cooldown (no reload within 15 min of the
  #    last attempt) and a hard retry cap (max 4 attempts per freeze episode).
  - id: bluetti_selfheal_reload_on_stale
    alias: "Bluetti self-heal: reload integration when telemetry frozen"
    mode: single
    trigger:
      # Fast first response: stale for 2 min beyond the detection threshold.
      - platform: state
        entity_id: binary_sensor.bluetti_telemetry_stale
        to: "on"
        for: "00:02:00"
        id: became_stale
      # Same fast first response for the fresh all-zeros mode (short debounce so a
      # single spurious zeros sample that self-corrects never triggers a reload).
      - platform: state
        entity_id: binary_sensor.bluetti_telemetry_all_zero
        to: "on"
        for: "00:02:00"
        id: became_all_zero
      # Retry cadence while still frozen (the cooldown condition paces it).
      - platform: time_pattern
        minutes: "/5"
        id: periodic_recheck
      # SECONDARY (optional, disabled): let card #211's Alertmanager POST here
      # as a cross-check trigger. The HA-native detector above stands alone; this
      # only shortens time-to-reload if the lar-side metric fires first. See the
      # runbook "#211 interlock" section before enabling.
      # - platform: webhook
      #   webhook_id: bluetti_telemetry_stale_from_lar
      #   allowed_methods: [POST]
      #   local_only: true
    condition:
      # Either freeze mode is currently active: no fresh poll (stale) OR a fresh
      # but physically-implausible all-zeros reading. Both funnel through the same
      # cooldown + retry-cap loop guard below, so a persistently-all-zeros cloud
      # can no more hammer reloads than a persistently-stale one.
      - condition: or
        conditions:
          - condition: state
            entity_id: binary_sensor.bluetti_telemetry_stale
            state: "on"
          - condition: state
            entity_id: binary_sensor.bluetti_telemetry_all_zero
            state: "on"
      # Cooldown: at least 15 min since the last reload attempt. The
      # input_datetime `timestamp` attribute is epoch seconds (tz-safe); unset
      # default (1970) is far in the past, so the first attempt always passes.
      - condition: template
        value_template: >
          {% set ts = state_attr('input_datetime.bluetti_selfheal_last_reload', 'timestamp') %}
          {{ ts is none or (now().timestamp() - ts) > (15 * 60) }}
    action:
      - choose:
          # Under the retry budget -> reload the integration.
          - conditions:
              - condition: numeric_state
                entity_id: counter.bluetti_selfheal_reload_count
                below: 4
            sequence:
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.bluetti_selfheal_last_reload
                data:
                  timestamp: "{{ now().timestamp() }}"
              - service: counter.increment
                target:
                  entity_id: counter.bluetti_selfheal_reload_count
              # Target the Bluetti config entry BY ENTITY: HA resolves this
              # entity -> its owning config entry -> reloads it. This needs NO
              # host-side config_entry_id (see runbook for the entry_id fallback).
              - service: homeassistant.reload_config_entry
                target:
                  entity_id: sensor.office_buzzbrick_battery_level
              - service: persistent_notification.create
                data:
                  notification_id: bluetti_selfheal
                  title: "Bluetti telemetry self-heal"
                  message: >
                    Battery telemetry looked frozen — stale poll
                    ({{ states('binary_sensor.bluetti_telemetry_stale') }}) or fresh
                    all-zeros ({{ states('binary_sensor.bluetti_telemetry_all_zero') }}).
                    Reloaded the Bluetti integration — attempt
                    {{ states('counter.bluetti_selfheal_reload_count') }} at
                    {{ now().strftime('%Y-%m-%d %H:%M:%S') }}.
              # OPTIONAL mobile push (host-specific service name; uncomment and
              # set your notify target on vesta):
              # - service: notify.mobile_app_<your_device>
              #   data:
              #     title: "Bluetti telemetry self-heal"
              #     message: >
              #       Frozen telemetry detected — reloaded the Bluetti integration
              #       (attempt {{ states('counter.bluetti_selfheal_reload_count') }}).
        # Retry budget exhausted -> stop hammering. No action here: the choose
        # falls through to a no-op so reloads pause. The owner-facing "power-cycle
        # the battery" escalation lives in its own automation
        # (`bluetti_selfheal_notify_stuck`, #246) so it fires exactly once per
        # episode and can carry an optional one-shot mobile push — instead of the
        # old inline escalate that re-fired on every ~15-min recheck tick.

  # 1b) Owner escalation (#246): when the auto-heal has SPENT its reload budget
  #     (counter hit the cap of 4) and telemetry is STILL frozen, tell the owner
  #     to power-cycle the battery by hand. Reloading the *integration* only ever
  #     fixes a wedged HA poller; it can do nothing about a battery/firmware hang
  #     (e.g. the 2026-08-19 firmware crash) or a real Bluetti-cloud outage — for
  #     those the human has to power-cycle the unit. This is the "auto-heal gave
  #     up" heads-up the card asks for: actionable, and NOT noise on every lumpy
  #     poll gap (a transient blip self-heals on reload 1 and never reaches here).
  #
  #     Reuses #212/#214's detectors + counter — NO new detector. The condition
  #     is exactly "reloads exhausted AND still frozen".
  - id: bluetti_selfheal_notify_stuck
    alias: "Bluetti self-heal: notify owner to power-cycle when auto-reload exhausted"
    mode: single
    trigger:
      # Primary: the reload budget is spent (counter parked at the cap of 4) and
      # has stayed there for 5 min — long enough to confirm the 4th reload did
      # NOT clear the freeze. `for` + the fixed cap mean this edges exactly once
      # per episode (the counter resets to 0 on recovery), so no re-fire spam.
      - platform: numeric_state
        entity_id: counter.bluetti_selfheal_reload_count
        above: 3
        for: "00:05:00"
        id: reload_budget_spent
      # Backstop: either freeze signature has stayed on continuously for 30 min
      # (well beyond the ~52-min 4-reload window's first attempts) even if, for
      # some edge reason, the counter path didn't latch. Still gated by the
      # "reloads exhausted" condition below so it can't fire early.
      - platform: state
        entity_id:
          - binary_sensor.bluetti_telemetry_stale
          - binary_sensor.bluetti_telemetry_all_zero
        to: "on"
        for: "00:30:00"
        id: frozen_30min
    condition:
      # Auto-heal has spent its budget: counter at the cap (== 4; the reload
      # action only increments while below 4, so it never climbs past it).
      - condition: numeric_state
        entity_id: counter.bluetti_selfheal_reload_count
        above: 3
      # ...and telemetry is STILL frozen in either mode.
      - condition: or
        conditions:
          - condition: state
            entity_id: binary_sensor.bluetti_telemetry_stale
            state: "on"
          - condition: state
            entity_id: binary_sensor.bluetti_telemetry_all_zero
            state: "on"
    action:
      # persistent_notification.create ALWAYS works (no host config) and shows in
      # the HA UI + the companion app's notifications. Stable notification_id so
      # it updates in place (one card per episode) and the recovery automation
      # can dismiss it by id.
      - service: persistent_notification.create
        data:
          notification_id: bluetti_telemetry_stuck
          title: "Bluetti telemetry STUCK — power-cycle the battery"
          message: >
            Bluetti telemetry is STILL frozen after the auto-heal spent its whole
            reload budget ({{ states('counter.bluetti_selfheal_reload_count') }}×
            integration reloads). Modes now:
            stale={{ states('binary_sensor.bluetti_telemetry_stale') }},
            all-zeros={{ states('binary_sensor.bluetti_telemetry_all_zero') }};
            freshest battery signal age ~{{
              (state_attr('binary_sensor.bluetti_telemetry_stale',
                          'freshest_signal_age_seconds') | float(0) / 60) | round(0)
            }} min. Reloading the integration can't fix a battery/firmware hang or
            a real Bluetti-cloud outage — POWER-CYCLE the Bluetti battery, then
            check the Bluetti integration and the wireless backhaul. Auto-reloads
            are paused until telemetry recovers; this clears automatically once it
            does.
      # OPTIONAL one-shot mobile push (#246): persistent_notification above is the
      # reliable default. To ALSO get a phone push, uncomment this and set your
      # device's notify service name on vesta. The exact service is host-side and
      # is NOT wired here (Assist could not confirm a notify.mobile_app_* service
      # from this repo) — find it on vesta under Developer Tools → Actions, type
      # `notify.mobile_app_` and read the autocomplete, e.g.
      # `notify.mobile_app_pixel_8`. This automation edges once per episode, so
      # the push is one-shot (no repeat spam).
      # - service: notify.mobile_app_<your_device>
      #   data:
      #     title: "Bluetti telemetry STUCK — power-cycle the battery"
      #     message: >
      #       Auto-heal exhausted ({{ states('counter.bluetti_selfheal_reload_count') }}×
      #       reloads) and Bluetti telemetry is still frozen. Power-cycle the battery.

  # 2) Recovery: once telemetry is fresh again for 2 min, reset the retry
  #    counter and clear the notifications so the next episode starts clean.
  - id: bluetti_selfheal_reset_on_recovery
    alias: "Bluetti self-heal: reset guard on telemetry recovery"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.bluetti_telemetry_stale
        to: "off"
        for: "00:02:00"
      - platform: state
        entity_id: binary_sensor.bluetti_telemetry_all_zero
        to: "off"
        for: "00:02:00"
    condition:
      # Only act if we were actually in a self-heal episode (counter > 0).
      - condition: numeric_state
        entity_id: counter.bluetti_selfheal_reload_count
        above: 0
      # An episode only "recovers" once BOTH freeze signatures have cleared: a
      # reload can fix one mode (e.g. staleness) while the other (all-zeros) is
      # still active, and resetting the retry cap then would let the still-broken
      # mode start a fresh, uncapped episode. Require both off.
      - condition: state
        entity_id: binary_sensor.bluetti_telemetry_stale
        state: "off"
      - condition: state
        entity_id: binary_sensor.bluetti_telemetry_all_zero
        state: "off"
    action:
      - service: counter.reset
        target:
          entity_id: counter.bluetti_selfheal_reload_count
      - service: persistent_notification.dismiss
        data:
          notification_id: bluetti_selfheal
      # #246 "stuck / power-cycle" escalation — clear it once telemetry recovers.
      - service: persistent_notification.dismiss
        data:
          notification_id: bluetti_telemetry_stuck
      # Legacy inline escalate id (#212). No longer created since #246, but
      # dismissing it is a harmless no-op and clears any card left on vesta from
      # before this package was re-applied.
      - service: persistent_notification.dismiss
        data:
          notification_id: bluetti_selfheal_escalate

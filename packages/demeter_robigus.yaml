# version: 1.0.0
#   1.0.0  2026-09-12  first cut (demeter card #293): Robigus's alert documents as
#                      sensors + notifications on new critical / warning conditions.
#
# Demeter — Robigus, the plant-health watch (demeter ADR-0009 §6, architecture §8 R2).
#
# Robigus is the ONE source of every hydroponic unit's plant-health conditions:
# it publishes retained JSON on demeter/<unit_id>/sys/alerts
#   {"unit": "pomona-0001", "ts": "...Z",
#    "alerts": [{"condition": "pump_not_running", "severity": "critical", "since": 1757600000, "detail": "..."}]}
# and the fleet's critical ones on demeter/sys/alerts. This package turns those
# into sensors and notifies on transitions; it decides nothing and sets nothing
# (that stays with the brains and the firmware). Broker ACL: the `homeassistant`
# user needs `subscribe demeter/#` (gitops platform/mqtt/files/acl.conf mirrors it).
#
# Add a unit: copy the pomona-0001 sensor + automation pair and change the id.

mqtt:
  sensor:
    # --- the tower ---------------------------------------------------------------
    - name: "Demeter pomona-0001 alerts"
      unique_id: demeter_pomona_0001_alerts
      state_topic: demeter/pomona-0001/sys/alerts
      value_template: "{{ value_json.alerts | count }}"
      json_attributes_topic: demeter/pomona-0001/sys/alerts
      json_attributes_template: >-
        {{ {"alerts": value_json.alerts,
            "conditions": value_json.alerts | map(attribute="condition") | list,
            "critical": value_json.alerts | selectattr("severity", "eq", "critical") | map(attribute="condition") | list,
            "ts": value_json.ts} | tojson }}
      icon: mdi:shield-alert-outline
      unit_of_measurement: "conditions"
    # --- the fleet (every unit's critical conditions) --------------------------------------
    - name: "Demeter fleet critical alerts"
      unique_id: demeter_fleet_critical_alerts
      state_topic: demeter/sys/alerts
      value_template: "{{ value_json.alerts | count }}"
      json_attributes_topic: demeter/sys/alerts
      json_attributes_template: >-
        {{ {"alerts": value_json.alerts,
            "units": value_json.alerts | map(attribute="unit") | unique | list,
            "ts": value_json.ts} | tojson }}
      icon: mdi:shield-alert
      unit_of_measurement: "conditions"
    # --- is Robigus itself alive? ---------------------------------------------------------------
    - name: "Demeter robigus status"
      unique_id: demeter_robigus_status
      state_topic: demeter/sys/status/robigus
      icon: mdi:eye-check-outline

automation:
  # A new CRITICAL condition anywhere in the fleet: a persistent notification
  # (and a phone push if a notify service is configured — uncomment and name it).
  - id: demeter_fleet_critical_raised
    alias: Demeter — critical plant-health condition
    description: >-
      Robigus raised a critical condition (node or brain offline, mixing actuator
      lost, pump not running). Something kills plants in hours if ignored.
    mode: queued
    trigger:
      - platform: state
        entity_id: sensor.demeter_fleet_critical_alerts
    condition:
      - condition: template
        value_template: >-
          {{ trigger.to_state is not none and trigger.from_state is not none
             and trigger.to_state.state not in ['unknown', 'unavailable']
             and (trigger.to_state.state | int(0)) > (trigger.from_state.state | int(0)) }}
    action:
      - service: persistent_notification.create
        data:
          notification_id: demeter_fleet_critical
          title: "Demeter — critical: {{ state_attr('sensor.demeter_fleet_critical_alerts', 'units') | join(', ') }}"
          message: >-
            {% for a in state_attr('sensor.demeter_fleet_critical_alerts', 'alerts') %}
            - **{{ a.unit }}** {{ a.condition }} — {{ a.detail }} (since {{ a.since | timestamp_custom('%H:%M', true) }})
            {% endfor %}
      # - service: notify.mobile_app_<your_phone>
      #   data:
      #     title: "Demeter — critical"
      #     message: "{{ state_attr('sensor.demeter_fleet_critical_alerts', 'alerts') | map(attribute='condition') | join(', ') }}"

  # Every critical condition cleared: dismiss the notification.
  - id: demeter_fleet_critical_cleared
    alias: Demeter — critical conditions cleared
    mode: single
    trigger:
      - platform: numeric_state
        entity_id: sensor.demeter_fleet_critical_alerts
        below: 1
    action:
      - service: persistent_notification.dismiss
        data:
          notification_id: demeter_fleet_critical

  # The tower: any change in its set of conditions refreshes one notification
  # listing them (warnings included), dismissed when the list is empty.
  - id: demeter_pomona_0001_alerts_changed
    alias: Demeter — pomona-0001 conditions changed
    mode: queued
    trigger:
      - platform: state
        entity_id: sensor.demeter_pomona_0001_alerts
        attribute: conditions
    action:
      - choose:
          - conditions:
              - condition: numeric_state
                entity_id: sensor.demeter_pomona_0001_alerts
                above: 0
            sequence:
              - service: persistent_notification.create
                data:
                  notification_id: demeter_pomona_0001
                  title: "Demeter — pomona-0001: {{ states('sensor.demeter_pomona_0001_alerts') }} condition(s)"
                  message: >-
                    {% for a in state_attr('sensor.demeter_pomona_0001_alerts', 'alerts') %}
                    - {{ a.condition }} ({{ a.severity }}) — {{ a.detail }}, since {{ a.since | timestamp_custom('%d %b %H:%M', true) }}
                    {% endfor %}
        default:
          - service: persistent_notification.dismiss
            data:
              notification_id: demeter_pomona_0001

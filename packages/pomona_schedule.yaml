# Pomona tower — pump + grow-light scheduling
# version: 2.1.0
#   2.1.0 (2026-09-13) the plug entities carry the unit id (owner): switch.pomona_0001_pump, switch.pomona_0001_light,
#         sensor.pomona_0001_pump_power — rename the Z-Wave entities in HA (Settings → Entities) when deploying this version
#   2.0.1 (2026-09-12) the topic root is ceres/ (ceres ADR-0012: Demeter became Ceres)
#   2.0.0 (2026-09-12) the v2 wire (ceres card #295, ADR-0008): relays follow
#                      ceres/pomona-0001/actuator/<pump|light>/state, the plug's watts go to
#                      actuator/pump/power_w, availability from sys/status; entity ids unchanged
#   1.3.0 (2026-09-11) relay the pump plug's power to MQTT for Ceres (#278, ceres ADR-0005)
#   1.2.0 (2026-09-11) pump-not-pumping alert: requested on but no plug power (#278)
#   1.1.0 (2026-09-03) relay reconciliation #277 (request mirrors + 5-min re-assert)
#   1.0.1 (2026-09-01) lamp entity fix: switch.pomona_0001_light (PR #17)
#   1.0.0 (2026-09-01) initial: duty cycle, photoperiod, relays, handover
# Bump on EVERY applied change (owner rule 2026-09-03): patch for fixes,
# minor for features — and update this header's history with it. The version
# ON VESTA tells you which behavior is live; compare before debugging.
# ===========================================================================
# First automation in the Pomona project. Until now control was explicitly
# DEFERRED (pump on a dumb power pack, no controller); the tower was planted
# on 2026-08-31 and now needs a duty cycle and a photoperiod, so scheduling
# moves in — but only via HA smart plugs, NOT via the GIGA firmware. Keeping
# control out of the GIGA is deliberate: that unit reboots for OTA, and a
# reboot must never be able to strand the pump off or the lights on.
#
# Drop-in Home Assistant *package*. Like the rest of this repo it is NOT
# auto-deployed — the `home-assitant` repo does not sync to vesta. Apply by
# hand on vesta (vesta.local / 192.168.50.18):
#     /config/packages/pomona_schedule.yaml
# with packages enabled in configuration.yaml:
#     homeassistant:
#       packages: !include_dir_named packages
# Companion runbook: ../pomona-schedule.md
#
# ---------------------------------------------------------------------------
# VERIFY THE ENTITY IDS BEFORE APPLYING
#
# These were read from HA as friendly names "Pomona Pump" and "Pomona Lamps",
# and the entity_ids below are the standard slugs. If either was ever renamed,
# the slug differs and these automations silently do NOTHING — no error, just
# a pump that never cycles. Check Developer Tools -> States and correct here.
#
# ---------------------------------------------------------------------------
# LEVEL AWARENESS — partial, and honestly so
#
# The tower level probe now reaches HA (packages/pomona_telemetry.yaml), but it
# does NOT give true dry-run protection, because of how it is mounted.
#
# The CQRSENYW003 is mounted as a TOP-UP GAUGE: point 1 wets at 8.2 L, point 3
# at 9.7 L. A reading of 0 points means "below 8.2 L" and the probe is BLIND
# below that line — it cannot tell 8 L from empty.
#
# So cutting the pump at 0 points would be WRONG twice over: it would stop
# irrigation at a perfectly healthy ~8 L, and it would fire routinely between
# top-ups. Killing the watering every time a top-up is a day late would destroy
# the crop far more reliably than the dry-run it was meant to prevent.
#
# What is implemented instead:
#   * a refill NOTIFICATION at 0 points (in the telemetry package), and
#   * a SUSTAINED-low inhibit below — the pump stops only after the level has
#     read 0 continuously for 24 h, which no longer means "time to top up" but
#     "nobody has topped up and this tank may genuinely be running out".
#
# It FAILS OPEN: if the sensor is unavailable or unknown, the pump keeps
# running. Over any 24 h window, plants dying of no water is a near certainty
# while an unnoticed empty tank is not, and the reservoir drains over days
# rather than hours.
#
# REAL dry-run protection is a MECHANICAL fix, not a software one: remount the
# probe (or add a second one) at pump-intake height, with point 1 just above
# the intake, so 0/4 genuinely means "stop the pump now". See the pomona repo
# doc docs/sensors/level-probe.md, which names both mounting options.
#
# ---------------------------------------------------------------------------
# THE TWO MODES
#
# `input_boolean.pomona_establishment` — ON now, turn it OFF around 2026-09-14
# (~2 weeks after transplant).
#
#                        | establishment          | established
#   pump, light hours    | 15 min on / 15 min off | 15 min on / 45 min off
#   pump, dark hours     | 15 min on / 15 min off | 15 min on, every 2 h
#   photoperiod          | 12 h (08:00-20:00)     | 14 h (06:00-20:00)
#
# WHY establishment is wetter: freshly transplanted roots are still only in
# the sponge and have not reached down into the tower interior. They cannot
# ride out a long dry gap, and a sponge that dries once will kill the plant.
# Once roots hang free the opposite is true — roots need air, so cycling beats
# soaking and the off-periods lengthen.
#
# WHY the light is shorter at first: the seedlings came off a tray and were
# advised shade for 2-3 days, so ramping avoids scorching them. 14 h is the
# steady-state target for fruiting crops indoors, and the DARK period is not
# optional — never run these lamps 24 h.
# ===========================================================================

input_boolean:
  pomona_establishment:
    name: Pomona establishment mode
    icon: mdi:sprout
    # ON = the wetter, gentler first-fortnight schedule. Transplanted
    # 2026-08-31, so turn this OFF around 2026-09-14.

  pomona_firmware_control:
    name: Pomona firmware control
    icon: mdi:chip
    # OFF = HA owns the schedule (the automations below).
    # ON  = the GIGA owns it; HA just relays its requests to the plugs.
    #
    # This is the cutover switch, and it is reversible in one click. Turn it
    # on when the firmware publishes ceres/pomona-0001/actuator/pump/state;
    # turn it off and HA resumes its own schedule immediately.

# Mirrors of the firmware's RETAINED control requests (#277). The relay
# automations below are edge-triggered; these sensors carry the CURRENT
# desired state at all times, which is what the reconciliation automation
# compares the plugs against. Retained + availability means they are correct
# immediately after an HA restart and go unavailable with the unit.
mqtt:
  binary_sensor:
    - name: Pomona pump requested
      unique_id: pomona_pump_requested
      state_topic: ceres/pomona-0001/actuator/pump/state
      payload_on: "on"
      payload_off: "off"
      availability_topic: ceres/pomona-0001/sys/status
      payload_available: online
      payload_not_available: offline
      icon: mdi:water-pump
    - name: Pomona light requested
      unique_id: pomona_light_requested
      state_topic: ceres/pomona-0001/actuator/light/state
      payload_on: "on"
      payload_off: "off"
      availability_topic: ceres/pomona-0001/sys/status
      payload_available: online
      payload_not_available: offline
      icon: mdi:lightbulb-auto

template:
  - binary_sensor:
      - name: Pomona firmware in command
        unique_id: pomona_firmware_in_command
        icon: mdi:chip
        # Exactly one controller may be active at a time, and this decides
        # which. The firmware is in command only while it is BOTH enabled AND
        # reachable — so a GIGA that crashes, wedges or is mid-OTA hands the
        # schedule straight back to HA rather than freezing the pump in
        # whatever state it last asked for. That fallback is the whole reason
        # the HA schedule is kept rather than deleted at cutover.
        state: >-
          {{ is_state('input_boolean.pomona_firmware_control', 'on')
             and is_state('binary_sensor.pomona_unit_online', 'on') }}

automation:
  # -------------------------------------------------------------------------
  # PUMP
  # -------------------------------------------------------------------------
  - id: pomona_pump_on_hourly
    alias: Pomona pump ON (top of the hour)
    description: >-
      Fires every hour at :00. In establishment mode the pump runs regardless;
      once established it runs through the light period, and only on even
      hours through the night when transpiration is low.
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "0"
    condition:
      # Stand down while the firmware is in command.
      - condition: state
        entity_id: binary_sensor.pomona_firmware_in_command
        state: "off"
      - condition: or
        conditions:
          - condition: state
            entity_id: input_boolean.pomona_establishment
            state: "on"
          - condition: time
            after: "06:00:00"
            before: "20:00:00"
          - condition: template
            value_template: "{{ now().hour % 2 == 0 }}"
      # Sustained-low inhibit. Fails OPEN on unknown/unavailable, on purpose.
      - condition: template
        value_template: >-
          {{ not is_state('binary_sensor.pomona_level_critically_low', 'on') }}
    action:
      - service: switch.turn_on
        target:
          entity_id: switch.pomona_0001_pump

  - id: pomona_pump_on_half_hour
    alias: Pomona pump ON (half past, establishment only)
    description: >-
      The extra half-hourly wetting that makes establishment 15/15 rather than
      15/45. Does nothing once establishment mode is off.
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "30"
    condition:
      # Stand down while the firmware is in command.
      - condition: state
        entity_id: binary_sensor.pomona_firmware_in_command
        state: "off"
      - condition: state
        entity_id: input_boolean.pomona_establishment
        state: "on"
      - condition: template
        value_template: >-
          {{ not is_state('binary_sensor.pomona_level_critically_low', 'on') }}
    action:
      - service: switch.turn_on
        target:
          entity_id: switch.pomona_0001_pump

  - id: pomona_pump_off
    alias: Pomona pump OFF (15 minutes after each start)
    description: >-
      Single OFF rule serving both modes — 15 minutes of run time per start.
      Firing when the pump is already off is harmless, which is deliberate: it
      doubles as a failsafe against a missed OFF leaving the pump running.
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "15"
      - platform: time_pattern
        minutes: "45"
    condition:
      # Stand down while the firmware is in command.
      - condition: state
        entity_id: binary_sensor.pomona_firmware_in_command
        state: "off"
    action:
      - service: switch.turn_off
        target:
          entity_id: switch.pomona_0001_pump

  # -------------------------------------------------------------------------
  # GROW LIGHT
  # -------------------------------------------------------------------------
  - id: pomona_light_on_established
    alias: Pomona light ON 06:00 (established only)
    description: Extends the photoperiod from 12 h to 14 h once past establishment.
    mode: single
    trigger:
      - platform: time
        at: "06:00:00"
    condition:
      # Stand down while the firmware is in command.
      - condition: state
        entity_id: binary_sensor.pomona_firmware_in_command
        state: "off"
      - condition: state
        entity_id: input_boolean.pomona_establishment
        state: "off"
    action:
      - service: switch.turn_on
        target:
          entity_id: switch.pomona_0001_light

  - id: pomona_light_on
    alias: Pomona light ON 08:00
    description: >-
      Runs in both modes. In establishment this starts a gentler 12 h day; once
      established the lamps are already on from 06:00 and this is a harmless
      no-op that also recovers a missed 06:00 trigger.
    mode: single
    trigger:
      - platform: time
        at: "08:00:00"
    condition:
      # Stand down while the firmware is in command.
      - condition: state
        entity_id: binary_sensor.pomona_firmware_in_command
        state: "off"
    action:
      - service: switch.turn_on
        target:
          entity_id: switch.pomona_0001_light

  - id: pomona_light_off
    alias: Pomona light OFF 20:00
    description: >-
      Ends the photoperiod. The dark period is required — plants respire and
      set fruit in it, and alpine strawberries under permanent light do worse,
      not better.
    mode: single
    trigger:
      - platform: time
        at: "20:00:00"
    condition:
      # Stand down while the firmware is in command.
      - condition: state
        entity_id: binary_sensor.pomona_firmware_in_command
        state: "off"
    action:
      - service: switch.turn_off
        target:
          entity_id: switch.pomona_0001_light

  - id: pomona_light_off_failsafe
    alias: Pomona light OFF failsafe (23:00)
    description: >-
      Catches a missed 20:00 OFF — an HA restart across the trigger, or a
      manual switch-on that was forgotten. Cheap insurance against cooking the
      tower overnight.
    mode: single
    trigger:
      - platform: time
        at: "23:00:00"
    condition:
      - condition: state
        entity_id: switch.pomona_0001_light
        state: "on"
    action:
      - service: switch.turn_off
        target:
          entity_id: switch.pomona_0001_light

  # -------------------------------------------------------------------------
  # FIRMWARE IN COMMAND — event -> HA -> Fibaro
  #
  # The GIGA decides and publishes what it wants; HA is only the relay to the
  # plugs. This is the first half of the target architecture in the pomona
  # repo's docs/control-architecture.md (Trello #260) — the decision moves to
  # the device that holds the sensors, while actuation stays in certified
  # smart plugs and no mains wiring is touched.
  #
  # CONTRACT (ceres ADR-0008, pomona firmware 2.0.0):
  #   ceres/pomona-0001/actuator/pump/state   "on" | "off"   RETAINED, QoS 1
  #   ceres/pomona-0001/actuator/light/state  "on" | "off"   RETAINED, QoS 1
  #   ceres/pomona-0001/actuator/pump/reason  why the node decided what it did
  # Before the firmware is 2.0.0 the broker's republish bridge mirrors the v1
  # pump/request + light/request onto these topics, so this package works either way.
  #
  # RETAINED is load-bearing: on an HA restart the broker replays the current
  # request immediately, so HA does not sit with the plugs in a stale state
  # waiting for the next firmware decision.
  # -------------------------------------------------------------------------
  - id: pomona_pump_follow_firmware
    alias: Pomona pump — follow firmware request
    description: Relays ceres/pomona-0001/actuator/pump/state onto the Fibaro plug.
    mode: queued
    max: 10
    trigger:
      - platform: mqtt
        topic: ceres/pomona-0001/actuator/pump/state
    condition:
      - condition: state
        entity_id: binary_sensor.pomona_firmware_in_command
        state: "on"
    action:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.payload | lower == 'on' }}"
            sequence:
              # The HA-side sustained-low inhibit stays as belt and braces.
              # The firmware owns the interlock, but a second opinion costs
              # nothing and this one has already been tested.
              - condition: state
                entity_id: binary_sensor.pomona_level_critically_low
                state: "off"
              - service: switch.turn_on
                target:
                  entity_id: switch.pomona_0001_pump
          - conditions:
              - condition: template
                value_template: "{{ trigger.payload | lower == 'off' }}"
            sequence:
              - service: switch.turn_off
                target:
                  entity_id: switch.pomona_0001_pump

  - id: pomona_light_follow_firmware
    alias: Pomona light — follow firmware request
    description: Relays ceres/pomona-0001/actuator/light/state onto the Fibaro plug.
    mode: queued
    max: 10
    trigger:
      - platform: mqtt
        topic: ceres/pomona-0001/actuator/light/state
    condition:
      - condition: state
        entity_id: binary_sensor.pomona_firmware_in_command
        state: "on"
    action:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.payload | lower == 'on' }}"
            sequence:
              - service: switch.turn_on
                target:
                  entity_id: switch.pomona_0001_light
          - conditions:
              - condition: template
                value_template: "{{ trigger.payload | lower == 'off' }}"
            sequence:
              - service: switch.turn_off
                target:
                  entity_id: switch.pomona_0001_light

  # -------------------------------------------------------------------------
  # RECONCILIATION (#277) — the relays above are edge-triggered: they act once
  # when a request message arrives. A single dropped Z-Wave frame (observed
  # 2026-09-03: firmware wanted the pump ON, plug sat OFF until a manual
  # command) or an HA restart across an edge leaves the plug diverged from the
  # firmware's intent FOREVER. This closes the loop: every 5 minutes, while
  # the firmware is in command, re-assert any plug that disagrees with the
  # retained request. The explicit state conditions keep it quiet when
  # everything already matches — no Z-Wave chatter on the happy path. A
  # requested-sensor that is unknown/unavailable matches no branch: fails
  # safe, nothing is asserted.
  # -------------------------------------------------------------------------
  - id: pomona_relay_reconcile
    alias: Pomona — reconcile plugs with firmware requests
    description: >-
      Every 5 minutes, while the firmware is in command, re-assert the pump
      and lamp plugs to match the retained request topics. Self-heals dropped
      Z-Wave commands, missed MQTT edges, and restarts.
    mode: single
    max_exceeded: silent
    trigger:
      - platform: time_pattern
        minutes: "/5"
    condition:
      - condition: state
        entity_id: binary_sensor.pomona_firmware_in_command
        state: "on"
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.pomona_pump_requested
                state: "on"
              - condition: state
                entity_id: switch.pomona_0001_pump
                state: "off"
              # Same belt-and-braces interlock as the edge relay.
              - condition: state
                entity_id: binary_sensor.pomona_level_critically_low
                state: "off"
            sequence:
              - service: switch.turn_on
                target:
                  entity_id: switch.pomona_0001_pump
          - conditions:
              - condition: state
                entity_id: binary_sensor.pomona_pump_requested
                state: "off"
              - condition: state
                entity_id: switch.pomona_0001_pump
                state: "on"
            sequence:
              - service: switch.turn_off
                target:
                  entity_id: switch.pomona_0001_pump
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.pomona_light_requested
                state: "on"
              - condition: state
                entity_id: switch.pomona_0001_light
                state: "off"
            sequence:
              - service: switch.turn_on
                target:
                  entity_id: switch.pomona_0001_light
          - conditions:
              - condition: state
                entity_id: binary_sensor.pomona_light_requested
                state: "off"
              - condition: state
                entity_id: switch.pomona_0001_light
                state: "on"
            sequence:
              - service: switch.turn_off
                target:
                  entity_id: switch.pomona_0001_light

  - id: pomona_command_handover
    alias: Pomona — control handed back to HA
    description: >-
      The firmware was in command and the unit went offline, so HA has resumed
      its own schedule. Worth saying out loud, because the tower silently
      changing controller is exactly the kind of thing that is confusing to
      debug three days later.
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.pomona_firmware_in_command
        from: "on"
        to: "off"
    condition:
      - condition: state
        entity_id: input_boolean.pomona_firmware_control
        state: "on"
    action:
      - service: persistent_notification.create
        data:
          title: Pomona — HA has taken back the schedule
          message: >-
            The GIGA was in command but is no longer reachable, so the HA pump
            and light schedules have resumed automatically. Nothing is lost —
            watering continues — but firmware control will not resume until the
            unit is back online.
          notification_id: pomona_command_handover

  # -------------------------------------------------------------------------
  # PUMP NOT PUMPING (owner 2026-09-11, #278). The pump runs in INTERVALS
  # (15 min per hour by day, per two hours at night), so this must never key
  # on the clock or on "no power" alone — an idle interval is not a fault.
  # It keys on INTENDED state only, and needs the mismatch to hold 10 min:
  #   (a) switch.pomona_0001_pump is ON (HA believes the plug is on — whichever
  #       schedule drives it) but the Fibaro reads under 2 W (~4.7 W when the
  #       pump runs): plug tripped, pump dead or dry, wiring.
  #   (b) the GIGA is in command and has requested "on" but the plug switch
  #       is still OFF: the relay path is broken (HA not following).
  # An unavailable power sensor is ignored (a Z-Wave hiccup is not a dry
  # pump) — the plug going unavailable is its own zwave_js signal. This
  # matters twice: no watering, and Ceres (the k3s dosing brain) needs
  # the pump to have run before it judges a dose — since ceres 0.5.1 it
  # reads this same plug power (relayed below) and refuses to dose while
  # the pump draws nothing. Cleared automatically when power returns.
  # -------------------------------------------------------------------------
  - id: pomona_pump_not_pumping
    alias: Pomona — pump should be running but is not
    description: >-
      (a) plug switched on but < 2 W for 10 min, or (b) firmware in command
      requesting on but the plug switch stayed off for 10 min. Never fires in
      a scheduled off-interval — it compares intended state with reality.
    mode: single
    trigger:
      - id: no_power
        platform: template
        value_template: >-
          {{ is_state('switch.pomona_0001_pump', 'on')
             and states('sensor.pomona_0001_pump_power') not in ['unknown', 'unavailable']
             and (states('sensor.pomona_0001_pump_power') | float(0)) < 2 }}
        for: "00:10:00"
      - id: relay
        platform: template
        value_template: >-
          {{ is_state('binary_sensor.pomona_firmware_in_command', 'on')
             and is_state('binary_sensor.pomona_pump_requested', 'on')
             and is_state('switch.pomona_0001_pump', 'off') }}
        for: "00:10:00"
    action:
      - service: persistent_notification.create
        data:
          title: Pomona — pump should be running but is NOT
          message: >-
            {% if trigger.id == 'no_power' %}
            switch.pomona_0001_pump has been ON for 10 minutes but the plug draws
            only {{ states('sensor.pomona_0001_pump_power') }} W — the pump is not
            running (tripped plug, dead or dry pump, wiring).
            {% else %}
            The GIGA is in command and has requested the pump ON for 10
            minutes, but switch.pomona_0001_pump is still off — the relay path
            (HA -> Fibaro) is not following the request.
            {% endif %}
            The tower is not being watered; Ceres sees the same 0 W and will
            not dose until power returns. (firmware in command:
            {{ states('binary_sensor.pomona_firmware_in_command') }}, requested:
            {{ states('binary_sensor.pomona_pump_requested') }}, switch:
            {{ states('switch.pomona_0001_pump') }}, power:
            {{ states('sensor.pomona_0001_pump_power') }} W)
          notification_id: pomona_pump_not_pumping

  - id: pomona_pump_pumping_again
    alias: Pomona — pump pumping again
    description: Clears the not-pumping notification as soon as the plug draws power.
    mode: single
    trigger:
      - platform: numeric_state
        entity_id: sensor.pomona_0001_pump_power
        above: 2
    action:
      - service: persistent_notification.dismiss
        data:
          notification_id: pomona_pump_not_pumping

  # -------------------------------------------------------------------------
  # PUMP POWER -> MQTT (owner 2026-09-11, #278; ceres 0.5.1 / ADR-0005).
  # Ceres judges a dose only on a MIXED tank. Its only evidence of
  # circulation used to be the firmware's REQUEST — and on 2026-09-11 it
  # counted ten minutes of "request on" while HA (firmware control still
  # off) drove the plug on its own schedule. The plug's measured power is
  # the truth, so relay it: retained ceres/pomona-0001/actuator/pump/power_w = the Fibaro's watts,
  # republished on every change, at HA start and every 5 minutes (Ceres
  # treats a reading older than 15 min as unknown and falls back to the
  # request). Retained like the requests: a restarted Ceres learns the
  # current state at once. Unknown/unavailable is not published — a stale
  # retained value is worse than the fallback.
  # Broker: the homeassistant user needs `publish ceres/+/actuator/+/power_w`
  # (gitops platform/mqtt — live mnesia rule + acl.conf DR mirror, #295).
  # ORDER: switch this package to 2.0.0 only once Vertumnus is on contract v2
  # (it reads the watts on the v2 topic; the bridge does not mirror v2 -> v1 here).
  # -------------------------------------------------------------------------
  - id: pomona_pump_power_to_mqtt
    alias: Pomona — relay pump plug power to MQTT (for Ceres)
    description: >-
      Publishes sensor.pomona_0001_pump_power as retained ceres/pomona-0001/actuator/pump/power_w on
      every change, at HA start and every 5 minutes, so Ceres can confirm
      the pump actually ran before judging a dose.
    mode: queued
    max: 10
    trigger:
      - platform: state
        entity_id: sensor.pomona_0001_pump_power
      - platform: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/5"
    condition:
      - condition: template
        value_template: >-
          {{ states('sensor.pomona_0001_pump_power') not in ['unknown', 'unavailable'] }}
    action:
      - service: mqtt.publish

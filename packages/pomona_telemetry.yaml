# Pomona tower — telemetry into Home Assistant over MQTT
# version: 2.0.0
#   2.0.0 (2026-09-12) the v2 wire (demeter card #295, ADR-0008): every topic moves to
#                      demeter/pomona-0001/… — tele/<zone>/<metric>, sys/status; entity ids unchanged
#   1.0.0 (2026-09-01) initial: MQTT sensors, settle check, sustained-low inhibit
# Bump on EVERY applied change (owner rule 2026-09-03): patch for fixes,
# minor for features — and update this header's history with it.
# ===========================================================================
# The unit publishes `demeter/pomona-0001/tele/<zone>/<metric>` (the v2 wire of
# the demeter repo's ADR-0008 — pomona firmware 2.0.0; before that the EMQX
# republish bridge mirrors the v1 tree onto it) to the shared EMQX broker
# (mqtt.lab.local:1883) every 30 s, with a retained `sys/status` backed by an
# MQTT Last Will. This package subscribes; the entity ids did not change.
#
# Until now the tower telemetry went MQTT -> Telegraf -> InfluxDB -> Grafana
# and never touched HA, which is why the pump schedule had no level awareness.
#
# Companion runbook: ../pomona-schedule.md
# Topic schema of record: demeter repo `docs/adr/0008-mqtt-topic-contract-v2.md`
#
# ---------------------------------------------------------------------------
# PREREQUISITE: the MQTT integration must be configured on this HA instance,
# pointed at mqtt.lab.local:1883 with credentials that can SUBSCRIBE to
# `demeter/#` (the `homeassistant` broker user, gitops platform/mqtt).
#
# ---------------------------------------------------------------------------
# THE PROBE CANNOT BE REMOUNTED LOWER
#
# Moving it to pump-intake height was the clean fix for real dry-run
# protection; the tank geometry does not allow it. The compensating control is
# the SETTLE CHECK further down: stop the pump, let the tower drain back, and
# only then believe a 0 reading.
#
# ---------------------------------------------------------------------------
# WHY STATE, NOT AN "EVENT"
#
# The obvious framing is "have the Arduino push an event when the water is
# low". Retained/periodic STATE is strictly better for an interlock: an event
# fires once, and anything that misses it — HA restarting, a dropped QoS-0
# message, a broker blip — leaves the pump unguarded with no way to notice.
# Periodic state plus an LWT means HA always knows both the current value and
# whether the reading can be trusted at all. Events are for notifying humans;
# state is for interlocks.
#
# Metrics are published NON-retained (see docs/mqtt.md), so after an HA restart
# each sensor is unknown for up to 30 s until the next publish. That is fine.
# What matters is `availability_topic`: the retained `sys/status` plus
# the broker LWT means a crashed or unplugged unit marks every sensor
# unavailable rather than leaving HA acting on a stale number.
# ===========================================================================

mqtt:
  sensor:
    - name: Pomona water level points
      unique_id: pomona_water_level_points
      state_topic: demeter/pomona-0001/tele/water/level_points
      availability_topic: demeter/pomona-0001/sys/status
      payload_available: online
      payload_not_available: offline
      unit_of_measurement: pts
      icon: mdi:water-percent
      # CQRSENYW003 ladder, 0-4. Mounted as a TOP-UP GAUGE, not a dry-run
      # sensor: point 1 wets at 8.2 L, point 3 at 9.7 L. 0 means "below
      # 8.2 L", and the probe is BLIND below that line - it cannot tell 8 L
      # from empty. Read the levels table in the pomona repo's
      # docs/sensors/level-probe.md before writing any rule against this.

    - name: Pomona water temperature
      unique_id: pomona_water_temp_c
      state_topic: demeter/pomona-0001/tele/water/temp_c
      availability_topic: demeter/pomona-0001/sys/status
      payload_available: online
      payload_not_available: offline
      device_class: temperature
      unit_of_measurement: "°C"
      state_class: measurement

    - name: Pomona EC
      unique_id: pomona_water_ec_ms_cm
      state_topic: demeter/pomona-0001/tele/water/ec_ms_cm
      availability_topic: demeter/pomona-0001/sys/status
      payload_available: online
      payload_not_available: offline
      unit_of_measurement: mS/cm
      state_class: measurement
      icon: mdi:flash
      # Target while the tower establishes: 0.8-1.0, ramping to the shared
      # 1.4-1.6 over 2-3 weeks. Analog sensor with no absence detection -
      # reads ~0 when unplugged rather than going unavailable.

    - name: Pomona pH
      unique_id: pomona_water_ph
      state_topic: demeter/pomona-0001/tele/water/ph
      availability_topic: demeter/pomona-0001/sys/status
      payload_available: online
      payload_not_available: offline
      state_class: measurement
      icon: mdi:ph
      # Target ~6.0 (window 5.8-6.2). Only published once calibrated.

    - name: Pomona air temperature
      unique_id: pomona_air_temp_c
      state_topic: demeter/pomona-0001/tele/air/temp_c
      availability_topic: demeter/pomona-0001/sys/status
      payload_available: online
      payload_not_available: offline
      device_class: temperature
      unit_of_measurement: "°C"
      state_class: measurement

    - name: Pomona air humidity
      unique_id: pomona_air_humidity_pct
      state_topic: demeter/pomona-0001/tele/air/humidity_pct
      availability_topic: demeter/pomona-0001/sys/status
      payload_available: online
      payload_not_available: offline
      device_class: humidity
      unit_of_measurement: "%"
      state_class: measurement

    - name: Pomona lux
      unique_id: pomona_air_lux
      state_topic: demeter/pomona-0001/tele/air/lux
      availability_topic: demeter/pomona-0001/sys/status
      payload_available: online
      payload_not_available: offline
      device_class: illuminance
      unit_of_measurement: lx
      state_class: measurement
      # Canopy target is >= 10 klx while the lamps are on. If the lamps
      # cannot reach it, more HOURS will not substitute for intensity.

  binary_sensor:
    - name: Pomona unit online
      unique_id: pomona_unit_online
      state_topic: demeter/pomona-0001/sys/status
      payload_on: online
      payload_off: offline
      device_class: connectivity
      # Retained + LWT, so this is trustworthy across HA restarts and is what
      # every other Pomona sensor keys its availability off.

input_boolean:
  pomona_level_confirmed_low:
    name: Pomona level confirmed low (settled reading)
    icon: mdi:water-alert
    # Set ONLY by the settle check below. A raw 0 from the probe is not
    # trustworthy while the pump is running; this is the verdict after the
    # water has been allowed to settle.

template:
  - binary_sensor:
      - name: Pomona level critically low
        unique_id: pomona_level_critically_low
        device_class: problem
        icon: mdi:water-off
        # The pump interlock. NOT the same thing as "time to top up".
        #
        # Keyed off the SETTLED verdict, not the raw probe, so in-transit water
        # can never trip it. Turns on only after the settled reading has stayed
        # low for 24 h, which means nobody topped up and the tank may genuinely
        # be running out. The probe is blind below 8.2 L, so this remains
        # inference rather than measurement.
        #
        # FAILS OPEN: an unknown or unavailable sensor never sets the confirmed
        # -low flag, so a dead probe or an offline unit leaves the pump running
        # rather than silently stopping irrigation.
        state: >-
          {{ is_state('input_boolean.pomona_level_confirmed_low', 'on') }}
        delay_on: "24:00:00"
        delay_off: "00:05:00"

automation:
  # -------------------------------------------------------------------------
  # SETTLE CHECK — stop, let the water come back, then believe the reading.
  #
  # The probe cannot be remounted lower (the tank geometry does not allow it),
  # so 0 points still only means "below the 8.2 L waterline". But a raw 0 read
  # DURING a pump cycle is not even that: an aeroponic tower holds a real
  # volume in transit — in the riser, the drip line and the tiers — so the
  # reservoir sits visibly lower while the pump runs than the total water
  # justifies. Turbulence at the tips adds flicker on top.
  #
  # So: on a raw 0, stop the pump, wait for the tower to drain back and the
  # surface to still, then read again.
  #   * recovered (>= 1 point) -> in-transit water, false alarm, resume.
  #   * still 0                -> a reading worth acting on. Notify, and set
  #                               the confirmed-low flag that the 24 h pump
  #                               inhibit is keyed off.
  #
  # This is the compensating control for not being able to move the probe. It
  # cannot detect an empty tank (nothing below 8.2 L can), but it stops the
  # pump on the only honest low signal available and it removes the false
  # positives that made the raw signal unusable.
  # -------------------------------------------------------------------------
  - id: pomona_level_settle_check
    alias: Pomona — level settle check
    description: >-
      On a sustained raw 0, cut the pump, let the tower drain back for 5
      minutes, then re-read and decide. Rate-limited to once an hour so it
      cannot thrash the pump.
    mode: single
    max_exceeded: silent
    trigger:
      - platform: numeric_state
        entity_id: sensor.pomona_water_level_points
        below: 1
        for: "00:02:00"
    condition:
      # Rate limit: at most one settle check per hour.
      - condition: template
        value_template: >-
          {{ state_attr('automation.pomona_level_settle_check', 'last_triggered') is none
             or (now() - state_attr('automation.pomona_level_settle_check', 'last_triggered')).total_seconds() > 3600 }}
    action:
      # 1. Stop the pump so the tower drains back and the surface stills.
      - service: switch.turn_off
        target:
          entity_id: switch.pomona_pump
      # 2. Let it settle. 5 min is comfortably longer than the tower takes to
      #    drain back, and costs at most one skipped 15-minute cycle.
      - delay: "00:05:00"
      # 3. Re-read and decide.
      - choose:
          - conditions:
              - condition: numeric_state
                entity_id: sensor.pomona_water_level_points
                above: 0
            sequence:
              # Recovered: it was water in transit, not a low tank.
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.pomona_level_confirmed_low
              - service: persistent_notification.dismiss
                data:
                  notification_id: pomona_refill
              - service: switch.turn_on
                target:
                  entity_id: switch.pomona_pump
          - conditions:
              - condition: numeric_state
                entity_id: sensor.pomona_water_level_points
                below: 1
            sequence:
              # Settled and still low: a reading worth acting on.
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.pomona_level_confirmed_low
              - service: persistent_notification.create
                data:
                  title: Pomona — top up the reservoir
                  message: >-
                    The level read 0 points, the pump was stopped and after 5
                    minutes of settling it is still 0 — so this is not water in
                    transit, the tank really is below the 8.2 L line. Top up
                    with plain demineralised water, then re-check EC:
                    evaporation concentrates the solution and a top-up dilutes
                    it. The pump keeps running on schedule for now; it is only
                    inhibited if this stays low for 24 h.
                  notification_id: pomona_refill
              - service: switch.turn_on
                target:
                  entity_id: switch.pomona_pump
        default:
          # Sensor went unknown/unavailable mid-check. Unknown is not empty —
          # resume pumping and leave the confirmed-low flag alone.
          - service: switch.turn_on
            target:
              entity_id: switch.pomona_pump

  - id: pomona_refill_cleared
    alias: Pomona — reservoir refilled
    description: >-
      Clears the confirmed-low flag and the notification as soon as the level
      is genuinely back in band, without waiting for another settle check.
    mode: single
    trigger:
      - platform: numeric_state
        entity_id: sensor.pomona_water_level_points
        above: 0
        for: "00:05:00"
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.pomona_level_confirmed_low
      - service: persistent_notification.dismiss
        data:
          notification_id: pomona_refill

  - id: pomona_unit_offline_alert
    alias: Pomona — unit offline
    description: >-
      The tower has no level awareness while the GIGA is down, so the pump
      schedule is running blind. Worth knowing about.
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.pomona_unit_online
        to: "off"
        for: "00:15:00"
    action:
      - service: persistent_notification.create
        data:
          title: Pomona — unit offline
          message: >-
            The GIGA has been offline for 15 minutes. The pump and light
            schedules keep running, but with no level or EC readings — check
            the reservoir by hand until it is back.
          notification_id: pomona_unit_offline
